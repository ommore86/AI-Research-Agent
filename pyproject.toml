[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Production-Oriented AI Research Agent with Multi-Step Planning, Tool Orchestration, and Self-Reflection"
authors = [{ name = "Om More", email = "ommore86@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.10.0"]
gemini = ["google-genai>=0.1.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
test = ["pytest>=7.4.0"]
all = [
    "openai>=1.10.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pytest>=7.4.0",
]

[project.scripts]
research-agent = "agent.cli:main"
research-web = "agent.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
